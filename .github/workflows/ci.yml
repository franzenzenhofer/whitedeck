name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # dist/ is rebuilt first: the CLI and MCP tests spawn the built binaries.
      - run: npm run build
      - run: npm run gates
      # The participant journey: every example with -f all. pptx, html and pdf on every OS,
      # key only on a Mac with Keynote (no runner has it, so key is a one-line skip here).
      - run: npm run smoke
